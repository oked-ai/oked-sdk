name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # `packages/*` is the workspace set, so a new package is tested when it
      # has a test script. The check below fails the job if one is missing.
      - run: npm test --workspaces --if-present
      - name: Every package has a test script
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, existsSync } from "node:fs";
            import { join } from "node:path";
            const missing = [];
            for (const name of readdirSync("packages")) {
              const pkgPath = join("packages", name, "package.json");
              if (!existsSync(pkgPath)) continue;
              const pkg = JSON.parse(readFileSync(pkgPath, "utf8"));
              if (!pkg.scripts || !pkg.scripts.test) missing.push(pkg.name || name);
            }
            if (missing.length) {
              console.error("packages without a test script: " + missing.join(", "));
              process.exit(1);
            }
          '
      # Packaging sanity check: confirms every package's `files` allowlist
      # resolves and produces a tarball before any release.
      - run: npm pack --dry-run --workspaces

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test oked
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python/oked[dev]"
          python -m pytest python/oked/tests
      - name: Lint, typecheck, and test oked-langgraph
        if: matrix.python-version != '3.9'
        run: |
          python -m pip install -e "python/oked-langgraph[dev]"
          python -m pip install ruff mypy
          ruff check python/oked python/oked-langgraph
          ruff format --check python/oked python/oked-langgraph
          mypy --config-file python/oked/pyproject.toml -p oked
          mypy --config-file python/oked-langgraph/pyproject.toml -p oked_langgraph
          python -m pytest python/oked-langgraph/tests

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking for now: surfaces high/critical advisories without
      # failing the build. Flip to a hard gate once the tree is clean.
      - run: npm audit --audit-level=high || true
